name: Heltec T114 Companion BLE Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'platformio.ini'
      - 'platformio.local.ini'
      - 'variants/heltec_t114/**'
      - 'src/**'
      - 'examples/companion_radio/**'
      - '.github/workflows/T114_build.yml'
  pull_request:
    paths:
      - 'platformio.ini'
      - 'platformio.local.ini'
      - 'variants/heltec_t114/**'
      - 'src/**'
      - 'examples/companion_radio/**'
      - '.github/workflows/T114_build.yml'

permissions:
  contents: write

jobs:
  build-t114-companion-ble:
    name: Build Heltec T114 Companion BLE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Heltec T114 Companion BLE firmware
        run: pio run -e Heltec_t114_companion_radio_ble

      - name: Prepare firmware ZIP
        run: |
          mkdir -p dist
          test -f .pio/build/Heltec_t114_companion_radio_ble/firmware.zip
          cp .pio/build/Heltec_t114_companion_radio_ble/firmware.zip \
             dist/Heltec-T114-Companion-BLE-firmware.zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heltec-T114-Companion-BLE
          path: dist/Heltec-T114-Companion-BLE-firmware.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Heltec-T114-Companion-BLE-firmware.zip
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
