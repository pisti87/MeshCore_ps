
name: T096 Companion BLE Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'platformio.ini'
      - 'platformio.local.ini'
      - 'variants/heltec_t096/**'
      - 'src/**'
      - 'examples/companion_radio/**'
      - '.github/workflows/T096_build.yml'
  pull_request:
    paths:
      - 'platformio.ini'
      - 'platformio.local.ini'
      - 'variants/heltec_t096/**'
      - 'src/**'
      - 'examples/companion_radio/**'
      - '.github/workflows/T096_build.yml'

permissions:
  contents: read

jobs:
  build-t096-companion-ble:
    name: Build T096 Companion BLE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build T096 Companion BLE firmware
        run: pio run -e Heltec_t096_companion_radio_ble

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T096-Companion-BLE
          path: .pio/build/Heltec_t096_companion_radio_ble/
          if-no-files-found: error
          retention-days: 14
